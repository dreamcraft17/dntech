version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dntech}
      POSTGRES_USER: ${POSTGRES_USER:-dntech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dntech123}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dntech']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dntech}:${POSTGRES_PASSWORD:-dntech123}@db:5432/${POSTGRES_DB:-dntech}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-use-long-random-string}
      PORT: ${PORT:-4000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dntech.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-DevOnly-LocalBootstrap-ChangeMe!}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
